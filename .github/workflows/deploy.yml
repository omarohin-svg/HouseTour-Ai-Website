# Publishes the static site in ./site to GitHub Pages (aihousetour.com).
# Runs on every push to main, and manually via workflow_dispatch. Merging to main publishes immediately.
#
# Notes:
#   - No Node / npm / Vite build: site/ is plain static HTML, uploaded as-is.
#   - The guard step checks the required files exist, fails if anything that looks like a Kit secret is in site/,
#     and warns if KIT_FORM_ID is still the TODO placeholder.
#   - The previous React + Vite site (and its workflow) is preserved at the git tag legacy-react-vite.
# The custom domain (aihousetour.com) lives in Settings > Pages and is NOT affected by this file.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard - site files present, Kit config sane, no secrets
        run: |
          set -e
          test -f site/index.html
          test -f site/privacy/index.html
          test -f site/assets/kira.png
          # Never ship a Kit API *secret* or a v4 key in a public page.
          if grep -RInE "api_secret|kit_[A-Za-z0-9]{16,}" site/; then
            echo "::error::Possible Kit secret found in site/. Only the public Kit form ID and tag IDs may be in the page; no keys."; exit 1
          fi
          if grep -q "TODO_KIT_FORM_ID" site/index.html; then
            echo "::warning::KIT_FORM_ID is still the TODO value - the waitlist will NOT send signups to Kit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
